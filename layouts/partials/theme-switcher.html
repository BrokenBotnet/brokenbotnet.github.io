{{- $default := site.Params.theme.palette | default "brokenbotnet" -}}
{{- $scriptFree := or (strings.HasPrefix .RelPermalink "/nojs/") (eq .Kind "404") -}}
<details class="theme-switcher" data-theme-switcher>
  <summary><span class="theme-switcher__label">
    <img class="theme-switcher__icon theme-switcher__icon--raster" src="{{ "icons/palette.png" | relURL }}" width="23" height="23" alt="" aria-hidden="true">
    {{ if not $scriptFree }}
    <svg class="theme-switcher__icon lucide lucide-palette" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/>
      <circle class="theme-switcher__paint--red" cx="13.5" cy="6.5" r=".5" fill="currentColor"/>
      <circle class="theme-switcher__paint--gold" cx="17.5" cy="10.5" r=".5" fill="currentColor"/>
      <circle class="theme-switcher__paint--blue" cx="6.5" cy="12.5" r=".5" fill="currentColor"/>
      <circle class="theme-switcher__paint--green" cx="8.5" cy="7.5" r=".5" fill="currentColor"/>
    </svg>
    {{ end }}
    <span>Theme<span data-theme-current></span></span>
  </span></summary>
  <div class="theme-switcher__choices" role="group" aria-label="Appearance">
    {{ range hugo.Data.themes }}
    <label for="theme-{{ .id }}"><input id="theme-{{ .id }}" type="radio" name="color-theme" value="{{ .id }}"{{ if eq $default .id }} checked{{ end }}><span class="theme-swatch theme-swatch--{{ .id }}" aria-hidden="true"></span>{{ .label }}</label>
    {{ end }}
    {{ if not $scriptFree }}<label class="theme-switcher__background" for="appearance-network"><input id="appearance-network" type="checkbox" name="background-relays" checked>Background relays</label>{{ end }}
  </div>
</details>
