{{- $isNoJS := .nojs -}}
<a class="footer-link footer-link--canary" href="{{ "canary.txt" | relURL }}" target="_blank" rel="noopener noreferrer" aria-label="Read the signed warrant canary in a new tab" title="Signed warrant canary">

    <img class="footer-link__canary-icon" src="{{ "icons/canary.png" | relURL }}" width="23" height="23" alt="" aria-hidden="true">
  {{- else -}}
    <svg class="footer-link__canary-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4C95D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 7h.01"/><path d="M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.28-2.3L2 20"/><path d="m20 7 2 .5-2 .5"/><path d="M10 18v3"/><path d="M14 17.75V21"/><path d="M7 18a6 6 0 0 0 3.84-10.61"/></svg>

</a>
