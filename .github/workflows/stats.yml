name: 📊🎉

on:
  workflow_dispatch:
  schedule:
    - cron: "37 18 * * *"

concurrency:
  group: project-statistics
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  TZ: Asia/Tokyo

jobs:
  refresh:
    name: Refresh committed project statistics
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Refresh authoritative statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-project-stats.mjs --refresh

      - name: Validate the generated snapshot
        shell: bash
        run: |
          set -euo pipefail

          node scripts/fetch-project-stats.mjs
          node --test scripts/fetch-project-stats.test.mjs
          jq empty data/project_stats.json
          git diff --check

          unexpected="$(
            git status --porcelain --untracked-files=all |
              awk '$2 != "data/project_stats.json"'
          )"

          if [[ -n "${unexpected}" ]]; then
            echo 'Unexpected files changed during statistics refresh:' >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Commit a changed snapshot
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/project_stats.json; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
            echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add -- data/project_stats.json

          test "$(
            git diff --cached --name-only
          )" = 'data/project_stats.json'

          git commit -m '📊 chore(stats): refresh project metrics'
          git push origin HEAD:main

          echo 'changed=true' >> "${GITHUB_OUTPUT}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Start validation for current main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_SHA: ${{ steps.snapshot.outputs.sha }}
        run: |
          set -euo pipefail

          git fetch --quiet origin main
          git merge-base --is-ancestor \
            "${SNAPSHOT_SHA}" \
            refs/remotes/origin/main

          gh workflow run validate.yml --ref main

      - name: Write refresh summary
        if: always()
        shell: bash
        env:
          CHANGED: ${{ steps.snapshot.outputs.changed || 'unknown' }}
          SNAPSHOT_SHA: ${{ steps.snapshot.outputs.sha || 'unavailable' }}
        run: |
          {
            echo '## Project statistics'
            echo
            echo "- Snapshot changed: \`${CHANGED}\`"
            echo "- Snapshot commit: \`${SNAPSHOT_SHA}\`"
            echo "- Checked: \`$(date +'%Y-%m-%d %H:%M')\`"

            if jq -e . data/project_stats.json >/dev/null 2>&1; then
              echo "- Verified at: \`$(jq -r .verified_at data/project_stats.json)\`"
              echo "- Tor Guard Relay: \`$(jq -r .tor_guard_relay.release data/project_stats.json)\`"
              echo "- Docker pulls: \`$(jq -r .tor_guard_relay.docker_pulls_formatted data/project_stats.json)\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
