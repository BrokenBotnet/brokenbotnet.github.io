name: 📊🎉

on:
  workflow_dispatch:
  schedule:
    - cron: "37 0,16 * * *"

concurrency:
  group: ${{ github.event_name == 'schedule' && 'scheduled-maintenance' || 'project-statistics' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TZ: Asia/Tokyo
  AUTOMATION_BRANCH: automation/project-statistics
  AUTOMATION_COMMIT: "📊 chore(stats): refresh project metrics"

jobs:
  refresh:
    name: Refresh committed project statistics
    if: github.repository == 'BrokenBotnet/brokenbotnet.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Refresh authoritative statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/fetch-project-stats.mjs --refresh

      - name: Validate the generated snapshot
        shell: bash
        run: |
          set -euo pipefail

          node scripts/fetch-project-stats.mjs
          node --test scripts/fetch-project-stats.test.mjs
          jq empty data/project_stats.json
          git diff --check

          unexpected="$(
            git status --porcelain --untracked-files=all |
              awk '$2 != "data/project_stats.json"'
          )"

          if [[ -n "${unexpected}" ]]; then
            echo 'Unexpected files changed during statistics refresh:' >&2
            printf '%s\n' "${unexpected}" >&2
            exit 1
          fi

      - name: Commit a changed snapshot
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- data/project_stats.json; then
            echo 'changed=false' >> "${GITHUB_OUTPUT}"
            echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git switch -c "${AUTOMATION_BRANCH}"
          git add -- data/project_stats.json

          test "$(
            git diff --cached --name-only
          )" = 'data/project_stats.json'

          git commit -m "${AUTOMATION_COMMIT}"

          echo 'changed=true' >> "${GITHUB_OUTPUT}"
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Create or update the protected-branch pull request
        id: pull_request
        if: steps.snapshot.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.BLOG_STATS_TOKEN }}
          HEAD_SHA: ${{ steps.snapshot.outputs.sha }}
        run: |
          set -euo pipefail

          [[ -n "${GH_TOKEN}" ]] || {
            echo 'BLOG_STATS_TOKEN is not configured' >&2
            exit 78
          }

          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'Generated snapshot commit SHA is invalid' >&2
            exit 64
          }

          gh auth setup-git

          remote_sha="$(
            git ls-remote \
              --heads \
              origin \
              "refs/heads/${AUTOMATION_BRANCH}" |
              awk 'NR == 1 { print $1 }'
          )"

          if [[ -n "${remote_sha}" ]]; then
            git push \
              --force-with-lease="refs/heads/${AUTOMATION_BRANCH}:${remote_sha}" \
              origin \
              "HEAD:refs/heads/${AUTOMATION_BRANCH}"
          else
            git push \
              origin \
              "HEAD:refs/heads/${AUTOMATION_BRANCH}"
          fi

          pr_number="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --base main \
              --head "${AUTOMATION_BRANCH}" \
              --json number \
              --jq '.[0].number // empty'
          )"

          body_file="${RUNNER_TEMP}/project-statistics-pr.md"

          cat > "${body_file}" <<EOF
          Automated refresh of the committed project statistics snapshot.

          The workflow validated that only \`data/project_stats.json\` changed.

          Source workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Snapshot commit: \`${HEAD_SHA}\`
          EOF

          if [[ -z "${pr_number}" ]]; then
            pr_url="$(
              gh pr create \
                --repo "${GITHUB_REPOSITORY}" \
                --base main \
                --head "${AUTOMATION_BRANCH}" \
                --title "${AUTOMATION_COMMIT}" \
                --body-file "${body_file}"
            )"

            pr_number="$(
              gh pr view \
                "${pr_url}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json number \
                --jq .number
            )"
          else
            gh pr edit \
              "${pr_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${AUTOMATION_COMMIT}" \
              --body-file "${body_file}"

            pr_url="$(
              gh pr view \
                "${pr_number}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json url \
                --jq .url
            )"
          fi

          gh pr merge \
            "${pr_number}" \
            --repo "${GITHUB_REPOSITORY}" \
            --squash \
            --auto \
            --subject "${AUTOMATION_COMMIT}" \
            --body '' \
            --match-head-commit "${HEAD_SHA}"

          merge_state="$(
            gh pr view \
              "${pr_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json state,mergedAt,autoMergeRequest \
              --jq '
                if .state == "MERGED" and .mergedAt != null then
                  "merged"
                elif .state == "OPEN" and .autoMergeRequest != null then
                  "auto-merge-enabled"
                else
                  "unexpected"
                end
              '
          )"

          [[ "${merge_state}" != 'unexpected' ]] || {
            echo 'Pull request exists, but auto-merge was not enabled' >&2
            exit 1
          }

          {
            echo "number=${pr_number}"
            echo "url=${pr_url}"
            echo "merge_state=${merge_state}"
          } >> "${GITHUB_OUTPUT}"

      - name: Write refresh summary
        if: always()
        shell: bash
        env:
          CHANGED: ${{ steps.snapshot.outputs.changed || 'unknown' }}
          SNAPSHOT_SHA: ${{ steps.snapshot.outputs.sha || 'unavailable' }}
          PR_NUMBER: ${{ steps.pull_request.outputs.number || 'none' }}
          PR_URL: ${{ steps.pull_request.outputs.url || 'none' }}
          MERGE_STATE: ${{ steps.pull_request.outputs.merge_state || 'not-requested' }}
        run: |
          {
            echo '## Project statistics'
            echo
            echo "- Snapshot changed: \`${CHANGED}\`"
            echo "- Snapshot commit: \`${SNAPSHOT_SHA}\`"
            echo "- Pull request: \`${PR_NUMBER}\`"
            echo "- Auto-merge: \`${MERGE_STATE}\`"
            echo "- Checked: \`$(date +'%Y-%m-%d %H:%M')\`"

            if [[ "${PR_URL}" != 'none' ]]; then
              echo "- Pull request URL: ${PR_URL}"
            fi

            if jq -e . data/project_stats.json >/dev/null 2>&1; then
              echo "- Verified at: \`$(jq -r .verified_at data/project_stats.json)\`"
              echo "- Tor Guard Relay: \`$(jq -r .tor_guard_relay.release data/project_stats.json)\`"
              echo "- Docker pulls: \`$(jq -r .tor_guard_relay.docker_pulls_formatted data/project_stats.json)\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
